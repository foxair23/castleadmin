<!DOCTYPE html>
<!-- @dsCard group="Components" name="Hero — Dark Photo" subtitle="Bright daytime garage-door photo with left-side scrim only" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);}
  .hero{position:relative;height:300px;overflow:hidden;display:flex;align-items:center;}
  .bg{position:absolute;inset:0;background:url('../assets/photos/hero/home-hero.png') center/cover;}
  /* Tighter left scrim so the garage door reads clearly */
  .ov{position:absolute;inset:0;background:
    linear-gradient(to right, rgba(15,15,15,.92) 0%, rgba(15,15,15,.75) 22%, rgba(15,15,15,.25) 38%, rgba(15,15,15,0) 55%);
  }
  .c{position:relative;z-index:2;padding:0 36px;color:#fff;max-width:460px;}
  .c::before{content:"";position:absolute;inset:-16px -24px -22px -8px;background:linear-gradient(to right, rgba(0,0,0,.45), rgba(0,0,0,0) 88%);border-radius:14px;z-index:-1;filter:blur(10px);}
  .heritage{font-size:11px;font-weight:700;letter-spacing:.15em;color:rgba(255,255,255,1);margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.9);}
  h1{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.18;letter-spacing:-.015em;margin:0 0 10px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95), 0 0 24px rgba(0,0,0,.6);}
  h1 .amp{color:var(--color-red);}
  .tag{font-size:14px;font-style:italic;color:#fff;opacity:1;margin:0 0 14px;text-shadow:0 1px 4px rgba(0,0,0,.85);}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--color-red);color:#fff;padding:11px 22px;border-radius:8px;font-family:var(--font-display);font-weight:600;font-size:14px;border:2px solid var(--color-red);box-shadow:0 4px 14px rgba(0,0,0,.25);}
</style>
</head>
<body>
  <section class="hero">
    <div class="bg"></div>
    <div class="ov"></div>
    <div class="c">
      <div class="heritage">FAMILY-OWNED &amp; OPERATED · SINCE 1981</div>
      <h1>Garage Door <span class="amp">&amp;</span> Gate Repair</h1>
      <p class="tag">San Diego's Knight at the Gate</p>
      <a class="btn">Schedule Service</a>
    </div>
  </section>
</body>
</html>
