<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radii & Shadows" subtitle="8/12 px corners · low-key neutral shadows" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii & Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--color-bg-light);padding:26px;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .box{background:#fff;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--color-primary);}
  .box small{font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--color-text-muted);margin-top:4px;font-family:'SF Mono','Menlo',monospace;}
  .r-6{border-radius:6px;box-shadow:var(--shadow-sm);}
  .r-8{border-radius:8px;box-shadow:var(--shadow-sm);}
  .r-12{border-radius:12px;box-shadow:var(--shadow-md);}
  .r-50{border-radius:50%;width:100px;margin:0 auto;background:var(--color-red);color:#fff;}
  .row2{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .sh{background:#fff;height:96px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;color:var(--color-primary);font-weight:600;}
  .s-sm{box-shadow:var(--shadow-sm);}
  .s-md{box-shadow:var(--shadow-md);}
  .s-lg{box-shadow:var(--shadow-lg);}
  .s-xl{box-shadow:var(--shadow-xl);}
</style>
</head>
<body>
  <div class="grid">
    <div class="box r-6">6 px<small>nav pills</small></div>
    <div class="box r-8">8 px<small>--radius default</small></div>
    <div class="box r-12">12 px<small>--radius-lg cards</small></div>
    <div class="box r-50">50%<small style="color:rgba(255,255,255,.8);">numerals</small></div>
  </div>
  <div class="row2">
    <div class="sh s-sm">sm<small style="display:block;font-weight:400;font-size:10px;font-family:'SF Mono','Menlo',monospace;color:var(--color-text-muted);">resting</small></div>
    <div class="sh s-md">md<small style="display:block;font-weight:400;font-size:10px;font-family:'SF Mono','Menlo',monospace;color:var(--color-text-muted);">hover</small></div>
    <div class="sh s-lg">lg<small style="display:block;font-weight:400;font-size:10px;font-family:'SF Mono','Menlo',monospace;color:var(--color-text-muted);">floating CTA</small></div>
    <div class="sh s-xl">xl<small style="display:block;font-weight:400;font-size:10px;font-family:'SF Mono','Menlo',monospace;color:var(--color-text-muted);">modal</small></div>
  </div>
</body>
</html>
