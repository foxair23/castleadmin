<!DOCTYPE html>
<!-- @dsCard group="Components" name="404 — Lost Knight" subtitle="404 page — the Knight got lost" viewport="700x560" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 — Lost Knight</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fafaf8;}
  .page{padding:36px 32px 48px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .mascot{width:280px;height:auto;display:block;margin-bottom:20px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.18));}
  .code{font-family:var(--font-display);font-weight:900;font-size:14px;letter-spacing:.2em;color:var(--color-red);text-transform:uppercase;margin:0 0 8px;}
  h1{font-family:var(--font-display);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:-.02em;color:var(--color-primary);margin:0 0 12px;text-transform:uppercase;max-width:540px;}
  p{font-size:16px;color:var(--color-text-secondary);max-width:480px;margin:0 0 20px;line-height:1.55;}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border-radius:8px;font-family:var(--font-display);font-weight:700;font-size:14px;border:2px solid transparent;text-decoration:none;letter-spacing:.02em;}
  .btn-r{background:var(--color-red);color:#fff;border-color:var(--color-red);}
  .btn-o{background:transparent;color:var(--color-primary);border-color:var(--color-primary);}
</style>
</head>
<body>
  <section class="page">
    <img class="mascot" src="../assets/mascot.webp" alt="Castle Knight scratching his head — page not found">
    <p class="code">Error 404</p>
    <h1>Looks Like Our Knight Took a Wrong Turn.</h1>
    <p>The page you're looking for doesn't exist or has been moved. Head back to home base or call us — we know exactly where we are.</p>
    <div class="btns">
      <a class="btn btn-r" href="/">Return Home</a>
      <a class="btn btn-o" href="tel:8005761397">Call (800) 576-1397</a>
    </div>
  </section>
</body>
</html>
