<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo & Wordmark" subtitle="Full-color logo — works on white and black" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;min-height:240px;}
  .panel{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:28px;}
  .light{background:#ffffff;}
  .dark{background:#0F0F0F;}
  .panel img{max-width:100%;width:320px;height:auto;display:block;}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6b6b6b;font-weight:700;font-family:var(--font-mono, ui-monospace, monospace);}
  .lbl-d{color:rgba(255,255,255,.6);}
</style>
</head>
<body>
  <div class="panel light">
    <img src="../assets/logo.png" alt="Castle Garage Doors &amp; Gates">
    <span class="lbl">Primary — on white</span>
  </div>
  <div class="panel dark">
    <img src="../assets/logo.png" alt="Castle Garage Doors &amp; Gates">
    <span class="lbl lbl-d">Reverse — on black (full color)</span>
  </div>
</body>
</html>
