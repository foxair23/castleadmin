<!DOCTYPE html>
<!-- @dsCard group="Components" name="Service Area Index" subtitle="All 12 service-area cards with real local photography" viewport="1000x760" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service Areas — Castle</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:#fff;font-family:var(--font-body);}
  .header{text-align:center;margin-bottom:24px;}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--color-red);font-weight:800;margin:0 0 6px;}
  h1{font-family:var(--font-display);font-weight:900;font-size:28px;color:var(--color-primary);margin:0 0 6px;text-transform:uppercase;letter-spacing:-.01em;}
  .lede{font-size:14px;color:var(--color-text-secondary);max-width:520px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .card{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;cursor:pointer;}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
  .card:hover img{transform:scale(1.04);}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(15,15,15,.85) 100%);pointer-events:none;}
  .card .label{position:absolute;left:14px;bottom:12px;right:14px;color:#fff;font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:-.01em;text-shadow:0 2px 6px rgba(0,0,0,.6);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card .label .arrow{font-size:14px;color:var(--color-red);}
</style>
</head>
<body>
  <div class="header">
    <p class="eyebrow">Service Areas</p>
    <h1>Serving San Diego to Riverside County</h1>
    <p class="lede">From the coast to the inland valleys — we're your local garage door and gate specialists.</p>
  </div>
  <div class="grid">
    <a class="card"><img src="../assets/photos/service-areas/san-diego.jpg" alt=""><div class="label"><span>San Diego</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/escondido.jpg" alt=""><div class="label"><span>Escondido</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/oceanside.jpeg" alt=""><div class="label"><span>Oceanside</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/carlsbad.png" alt=""><div class="label"><span>Carlsbad</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/encinitas.webp" alt=""><div class="label"><span>Encinitas</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/north-county.webp" alt=""><div class="label"><span>North County</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/temecula.jpg" alt=""><div class="label"><span>Temecula</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/murrieta.jpg" alt=""><div class="label"><span>Murrieta</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/fallbrook.jpg" alt=""><div class="label"><span>Fallbrook</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/bonsall.avif" alt=""><div class="label"><span>Bonsall</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/riverside-county.jpg" alt=""><div class="label"><span>Riverside County</span><span class="arrow">→</span></div></a>
    <a class="card"><img src="../assets/photos/service-areas/corona.jpeg" alt=""><div class="label"><span>Corona</span><span class="arrow">→</span></div></a>
  </div>
</body>
</html>
