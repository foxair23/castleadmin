<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4-base scale · sections breathe at 64–96px" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--color-bg-white);padding:22px 28px;font-family:var(--font-body);}
  .row{display:flex;align-items:center;gap:14px;padding:6px 0;}
  .tag{font-family:'SF Mono','Menlo',monospace;font-size:12px;color:var(--color-text-muted);min-width:78px;}
  .bar{height:14px;background:var(--color-red);border-radius:3px;}
  .px{font-size:12px;color:var(--color-text-secondary);min-width:40px;}
</style>
</head>
<body>
  <div class="row"><span class="tag">--space-1</span><span class="bar" style="width:4px"></span><span class="px">4 px</span></div>
  <div class="row"><span class="tag">--space-2</span><span class="bar" style="width:8px"></span><span class="px">8 px</span></div>
  <div class="row"><span class="tag">--space-3</span><span class="bar" style="width:12px"></span><span class="px">12 px</span></div>
  <div class="row"><span class="tag">--space-4</span><span class="bar" style="width:16px"></span><span class="px">16 px</span></div>
  <div class="row"><span class="tag">--space-6</span><span class="bar" style="width:24px"></span><span class="px">24 px</span></div>
  <div class="row"><span class="tag">--space-8</span><span class="bar" style="width:32px"></span><span class="px">32 px</span></div>
  <div class="row"><span class="tag">--space-12</span><span class="bar" style="width:48px"></span><span class="px">48 px</span></div>
  <div class="row"><span class="tag">--space-16</span><span class="bar" style="width:64px"></span><span class="px">64 px · section pad</span></div>
  <div class="row"><span class="tag">--space-24</span><span class="bar" style="width:96px"></span><span class="px">96 px · desktop section pad</span></div>
</body>
</html>
