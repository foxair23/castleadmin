<!DOCTYPE html>
<!-- @dsCard group="Components" name="Field Guide Byline" subtitle="Field Guide article header — circular Knight avatar" viewport="700x340" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field Guide Byline</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;font-family:var(--font-body);background:#fff;color:var(--color-text-primary);}
  .article{max-width:620px;margin:0 auto;}
  .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--color-red);margin:0 0 10px;}
  h1{font-family:var(--font-display);font-weight:900;font-size:32px;line-height:1.1;letter-spacing:-.02em;color:var(--color-primary);margin:0 0 18px;}
  .byline{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--color-border-light);border-bottom:1px solid var(--color-border-light);}
  .avatar{width:52px;height:52px;border-radius:50%;background:#0F0F0F;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;overflow:hidden;border:2px solid var(--color-red);}
  .avatar img{width:64px;height:auto;display:block;transform:translateY(2px);object-fit:cover;}
  .meta{display:flex;flex-direction:column;}
  .meta .who{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--color-primary);}
  .meta .when{font-size:13px;color:var(--color-text-muted);}
  p.lede{margin:20px 0 0;font-size:17px;line-height:1.65;color:var(--color-text-primary);}
  p.lede strong{color:var(--color-primary);}
</style>
</head>
<body>
  <article class="article">
    <p class="tag">Field Guide · Troubleshooting</p>
    <h1>Why Is My Garage Door So Loud?</h1>
    <div class="byline">
      <div class="avatar"><img src="../assets/mascot.webp" alt="Castle Knight"></div>
      <div class="meta">
        <span class="who">The Castle Knight</span>
        <span class="when">May 12, 2026 · 6 min read</span>
      </div>
    </div>
    <p class="lede">Grinding. Squeaking. Banging. A loud garage door is almost always trying to tell you something — and most of the time, it's an easy fix. Here's how our techs diagnose it in the field.</p>
  </article>
</body>
</html>
