<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Partner Logos" subtitle="Local real logo files — Clopay MAD &amp; Gold Bar, LiftMaster, Genie, Home Depot" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Partners</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:#fff;font-family:var(--font-body);}
  .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.16em;color:var(--color-red);font-weight:800;margin:0 0 6px;}
  .heading{font-family:var(--font-display);font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;color:var(--color-text-primary);margin:0 0 4px;}
  .sub{font-size:15px;line-height:1.55;color:var(--color-text-secondary);margin:0 0 22px;max-width:640px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch;}
  .tile{background:#fff;border:1px solid var(--color-border);border-radius:10px;height:112px;display:flex;align-items:center;justify-content:center;padding:14px;}
  .tile img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}
  /* Per-logo size tuning so visual weight is balanced */
  .tile.clopay-mad img{max-height:96px;}
  .tile.liftmaster img{max-height:32px;}
  .tile.genie img{max-height:64px;}
  .tile.hd img{max-height:72px;}
</style>
</head>
<body>
  <p class="eyebrow">Authorized Dealer &amp; Service Provider</p>
  <h2 class="heading">Trusted Partners</h2>
  <p class="sub">Castle is factory-authorized by these manufacturers and the <strong>only Home Depot installation partner across all of San Diego County.</strong></p>
  <div class="grid">
    <div class="tile clopay-mad"><img src="../assets/partners/clopay-mad.png" alt="Clopay Master Authorized Dealer"></div>
    <div class="tile liftmaster"><img src="../assets/partners/liftmaster.png" alt="LiftMaster"></div>
    <div class="tile genie"><img src="../assets/partners/genie.avif" alt="Genie — The Brand You Trust"></div>
    <div class="tile hd"><img src="../assets/partners/home-depot-services.webp" alt="The Home Depot Home Services — Authorized Service Provider"></div>
  </div>
</body>
</html>
