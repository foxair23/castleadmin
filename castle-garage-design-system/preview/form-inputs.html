<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="1.5px border, red focus ring" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forms</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--color-bg-white);padding:24px 28px;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  label{display:block;font-size:14px;font-weight:600;color:var(--color-primary);margin-bottom:6px;}
  input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--color-border);border-radius:8px;font-size:15px;font-family:var(--font-body);background:#fff;color:var(--color-text-primary);transition:border-color .2s,box-shadow .2s;}
  input:focus,select:focus{outline:none;border-color:var(--color-red);box-shadow:0 0 0 3px rgba(200,30,30,.1);}
  .focused{border-color:var(--color-red)!important;box-shadow:0 0 0 3px rgba(200,30,30,.1);}
  textarea{min-height:60px;resize:vertical;}
</style>
</head>
<body>
  <div class="grid">
    <div><label>Full Name</label><input value="Jennifer Martinez"></div>
    <div><label>Phone</label><input class="focused" placeholder="(800) 576-1397"></div>
    <div><label>Service Needed</label><select><option>Garage Door Repair</option></select></div>
    <div><label>City</label><input placeholder="Escondido, CA"></div>
    <div style="grid-column:1/-1;"><label>Describe the issue</label><textarea>Spring snapped, door is stuck open.</textarea></div>
  </div>
</body>
</html>
