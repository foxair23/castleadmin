<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutrals & Surfaces" subtitle="Warm off-white page, white cards, neutral text ramp" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Castle — Neutrals & Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--color-bg-light);padding:20px;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{height:108px;border-radius:10px;border:1px solid var(--color-border);position:relative;overflow:hidden;}
  .sw .var{position:absolute;left:10px;top:9px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
  .sw .lbl{position:absolute;left:10px;bottom:24px;font-family:var(--font-display);font-weight:600;font-size:13px;}
  .sw .hex{position:absolute;left:10px;bottom:8px;font-size:11px;font-family:'SF Mono','Menlo',monospace;opacity:.7;}
  .light .var,.light .lbl,.light .hex{color:#1A1A1A;}
  .dark  .var,.dark  .lbl,.dark  .hex{color:#fff;}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw light" style="background:#FFFFFF;">
      <span class="var">bg-white</span><span class="lbl">White</span><span class="hex">#FFFFFF</span>
    </div>
    <div class="sw light" style="background:#F7F7F5;">
      <span class="var">surface</span><span class="lbl">Surface</span><span class="hex">#F7F7F5</span>
    </div>
    <div class="sw light" style="background:#F5F5F3;">
      <span class="var">bg-light · page</span><span class="lbl">Page</span><span class="hex">#F5F5F3</span>
    </div>
    <div class="sw light" style="background:#E2E0DC;">
      <span class="var">border</span><span class="lbl">Border</span><span class="hex">#E2E0DC</span>
    </div>
    <div class="sw light" style="background:#FFF;color:#1A1A1A;">
      <span class="var">text-primary</span>
      <span class="lbl" style="color:#1A1A1A;">Text Primary</span>
      <span class="hex" style="color:#1A1A1A;">#1A1A1A</span>
    </div>
    <div class="sw light" style="background:#FFF;">
      <span class="var" style="color:#64646E;">text-secondary</span>
      <span class="lbl" style="color:#64646E;">Text Secondary</span>
      <span class="hex" style="color:#64646E;">#64646E</span>
    </div>
    <div class="sw light" style="background:#FFF;">
      <span class="var" style="color:#8A8A94;">text-muted</span>
      <span class="lbl" style="color:#8A8A94;">Text Muted</span>
      <span class="hex" style="color:#8A8A94;">#8A8A94</span>
    </div>
    <div class="sw dark" style="background:#1A1A22;">
      <span class="var">bg-dark-soft</span><span class="lbl">Dark Soft</span><span class="hex">#1A1A22</span>
    </div>
  </div>
</body>
</html>
