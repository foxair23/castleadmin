<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SF Remittance Poster — Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #111; }
    h1 { font-size: 18px; } label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
    input[type=text], input[type=url], input[type=number] { width: 100%; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    .row label { margin: 0; font-weight: 600; }
    .hint { font-size: 12px; color: #666; margin-top: 3px; }
    button { margin-top: 18px; background: #b91c1c; color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font-weight: 600; cursor: pointer; }
    .saved { color: #16a34a; font-size: 13px; margin-left: 10px; }
    .warn { background: #fef3c7; border: 1px solid #fde68a; padding: 8px 10px; border-radius: 6px; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Service Fusion Remittance Poster</h1>
  <div class="warn"><strong>Dry run is ON by default</strong> — it does everything except the final submit, and logs what it would post. Turn it off only after a dry run looks correct.</div>

  <label>Castle Admin URL</label>
  <input id="baseUrl" type="url" placeholder="https://castleadmin.vercel.app" />
  <div class="hint">Your Castle Admin origin (no trailing path).</div>

  <label>Apply token</label>
  <input id="token" type="text" placeholder="matches REMITTANCE_APPLY_TOKEN on the server" />

  <label>Received by (initials in SF)</label>
  <input id="receivedBy" type="text" maxlength="8" />

  <label>Poll interval (minutes)</label>
  <input id="pollMinutes" type="number" min="1" />

  <div class="row"><input id="enabled" type="checkbox" /><label for="enabled">Enabled (poll & post in the background)</label></div>
  <div class="row"><input id="dryRun" type="checkbox" /><label for="dryRun">Dry run (don't actually submit)</label></div>

  <div><button id="save">Save</button><span id="saved" class="saved" style="display:none">Saved ✓</span></div>
  <script type="module" src="options.js"></script>
</body>
</html>
