<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #111; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; }
    .on { background: #dcfce7; color: #166534; } .off { background: #f3f4f6; color: #6b7280; }
    .dry { background: #fef3c7; color: #92400e; }
    button { width: 100%; margin-top: 10px; background: #b91c1c; color: #fff; border: 0; border-radius: 6px; padding: 8px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #374151; }
    .status { margin-top: 10px; font-size: 12px; color: #374151; white-space: pre-wrap; max-height: 220px; overflow: auto; background: #f9fafb; border: 1px solid #eee; border-radius: 6px; padding: 8px; }
    a { font-size: 12px; }
  </style>
</head>
<body>
  <h1>SF Remittance Poster</h1>
  <div id="pills"></div>
  <button id="run">Run now (remittances + notes)</button>
  <button id="crawl" class="secondary">Full Genie crawl now</button>
  <button id="crawlClopay" class="secondary">Full Clopay crawl now</button>
  <button id="syncClopayDocs" class="secondary">Sync Clopay documents now</button>
  <button id="options" class="secondary">Options</button>
  <div id="status" class="status">No runs yet.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
